<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Silo motion review</title>
<style>
body{margin:0;background:#181b1d;color:#f3f1ed;font:14px system-ui}main{max-width:1120px;margin:24px auto;padding:0 24px}video{display:block;width:100%;max-width:1120px;margin:auto;background:#202326}video.phone{max-width:390px}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:18px 0}button,select{font:inherit;padding:8px 12px;border:1px solid #666;background:#24292c;color:inherit;border-radius:5px}input{flex:1;min-width:180px}output{font-variant-numeric:tabular-nums;min-width:76px}p{color:#a2aaa9}
</style>
<main>
<video id="film" playsinline preload="auto"></video>
<nav><button id="play">Play / pause</button><button id="back">−1 frame</button><button id="forward">+1 frame</button><input id="seek" aria-label="Film position" type="range" min="0" max="45" step="0.01" value="0"><output id="time">0.000 s</output><select id="speed" aria-label="Playback speed"><option value="0.5">Half speed</option><option value="1" selected>Normal speed</option></select><button id="phone">Phone size</button></nav>
<p id="source"></p>
</main>
<script>
const film=document.querySelector('#film'),seek=document.querySelector('#seek'),time=document.querySelector('#time');
const file=new URLSearchParams(location.search).get('file')||'render/silo-animatic.mp4';
film.src=file;document.querySelector('#source').textContent=file;
function move(t){film.pause();film.currentTime=Math.max(0,Math.min(film.duration||45,t));seek.value=film.currentTime;time.value=film.currentTime.toFixed(3)+' s'}
document.querySelector('#play').onclick=()=>film.paused?film.play():film.pause();
document.querySelector('#back').onclick=()=>move(film.currentTime-1/60);
document.querySelector('#forward').onclick=()=>move(film.currentTime+1/60);
document.querySelector('#phone').onclick=()=>film.classList.toggle('phone');
document.querySelector('#speed').onchange=e=>film.playbackRate=+e.target.value;
seek.oninput=()=>move(+seek.value);film.ontimeupdate=()=>{seek.value=film.currentTime;time.value=film.currentTime.toFixed(3)+' s'};
film.onloadedmetadata=()=>seek.max=film.duration;
</script>
</html>
