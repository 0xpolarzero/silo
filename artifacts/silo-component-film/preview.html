<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Silo · film review</title><style>body{margin:0;background:#171b18;color:#f3f1e9;font:15px system-ui}main{max-width:1120px;margin:24px auto;padding:0 22px}video{width:100%;background:#f3f1e9;border-radius:8px}nav{display:flex;align-items:center;gap:18px;padding:18px 0}button,select{font:inherit;padding:7px 13px;border:1px solid #657262;background:transparent;color:inherit;border-radius:6px}input{flex:1}output{font-variant-numeric:tabular-nums;width:90px}p{color:#abb6a6}</style><main><video id="film" controls playsinline preload="auto" poster="output/frame-1.80.png" src="output/silo-computers.mp4"></video><nav><button id="play">Play / pause</button><input id="seek" aria-label="Film position" type="range" min="0" max="36" step="0.05" value="0"><output id="time">0.00 s</output><select id="version" aria-label="Film version"><option value="draft.mp4">Draft</option><option selected value="silo-computers.mp4">Final</option><option value="study-1.mp4">Study: connection</option><option value="study-2.mp4">Study: workspace</option><option value="study-3.mp4">Study: address</option></select></nav><p>Silo · Computers for your agents · 36 seconds</p></main><script>const video=document.querySelector('#film'),seek=document.querySelector('#seek'),time=document.querySelector('#time');document.querySelector('#play').onclick=()=>video.paused?video.play():video.pause();seek.oninput=()=>{video.pause();video.currentTime=+seek.value;time.value=(+seek.value).toFixed(2)+' s'};video.ontimeupdate=()=>{seek.value=video.currentTime;time.value=video.currentTime.toFixed(2)+' s'};document.querySelector('#version').onchange=e=>{video.src='output/'+e.target.value;video.load()};video.onloadedmetadata=()=>seek.max=video.duration;</script></html>
