[package]
name = "silo-preview"
version = "0.0.0"
description = "Silo UI fixture preview"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = ["image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27"
uuid = "1"

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2.11.3", features = ["tray-icon"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3.6"
