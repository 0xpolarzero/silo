[package]
name = "silo-ui"
version = "0.1.0"
description = "Silo desktop application"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2.11.3", features = ["macos-private-api", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2.7"
tauri-plugin-updater = "=2.11.0"
tokio = { version = "1", features = ["sync", "time", "macros"] }
base64 = "0.22"
libc = "0.2"
microsandbox-image = { git = "https://github.com/superradcompany/microsandbox", rev = "5eca4de8bf233e57f114140f8c076ea8c96f21ab", package = "microsandbox-image" }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
time = { version = "0.3", features = ["parsing", "formatting"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
keyring = { version = "3.6", features = ["apple-native", "sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2.11.3", features = ["tray-icon"] }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-service-management = { version = "0.3.2", features = ["SMAppService"] }
objc2-user-notifications = { version = "0.3.2", features = ["UNNotificationSettings", "UNUserNotificationCenter", "block2"] }
block2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3.6"
gio = "0.18"
gtk = "0.18"

[patch.crates-io]
tauri-plugin-updater = { path = "vendor/tauri-plugin-updater" }
