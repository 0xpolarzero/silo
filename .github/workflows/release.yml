name: Build Silo release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      draft:
        description: Create versioned draft after all builds pass (requires vVERSION tag)
        type: boolean
        default: false
      benchmark_ref:
        description: Optional full source commit for artifact-only benchmarks
        type: string
        default: ''
      benchmark_schedule:
        description: Artifact-only comparison; releases always run native tests in parallel
        type: choice
        options: [parallel, sequential]
        default: parallel
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && !inputs.draft && format('silo-release-benchmark-{0}', github.run_id) || 'silo-release-build' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      draft: ${{ steps.release.outputs.draft }}
      source-ref: ${{ steps.source.outputs.ref }}
      runtime-macos: ${{ steps.runtime-macos.outputs.cache-hit }}
      runtime-x64: ${{ steps.runtime-x64.outputs.cache-hit }}
      runtime-arm64: ${{ steps.runtime-arm64.outputs.cache-hit }}
    steps:
      - name: Validate source revision before checkout
        id: source
        env:
          BENCHMARK_REF: ${{ inputs.benchmark_ref }}
          EVENT_NAME: ${{ github.event_name }}
          CREATE_DRAFT: ${{ github.event_name == 'push' || inputs.draft }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          source_ref="$TRIGGER_SHA"
          if [[ -n "$BENCHMARK_REF" ]]; then
            if [[ "$EVENT_NAME" != workflow_dispatch || "$CREATE_DRAFT" == true || ! "$BENCHMARK_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo '::error::A source override requires an artifact-only dispatch and a full commit SHA.'
              exit 1
            fi
            source_ref="$BENCHMARK_REF"
          fi
          echo "ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "Workflow commit: $TRIGGER_SHA; source commit: $source_ref"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate runtime inputs without building
        run: node app/SiloUI/scripts/preflight.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check exact public runtime cache for aarch64-apple-darwin
        id: runtime-macos
        uses: ./.github/actions/prepare-release-runtime
        with:
          runner: macos-15
          target: aarch64-apple-darwin
          lookup-only: 'true'
      - name: Check exact public runtime cache for x86_64-unknown-linux-gnu
        id: runtime-x64
        uses: ./.github/actions/prepare-release-runtime
        with:
          runner: ubuntu-24.04
          target: x86_64-unknown-linux-gnu
          lookup-only: 'true'
      - name: Check exact public runtime cache for aarch64-unknown-linux-gnu
        id: runtime-arm64
        uses: ./.github/actions/prepare-release-runtime
        with:
          runner: ubuntu-24.04-arm
          target: aarch64-unknown-linux-gnu
          lookup-only: 'true'
      - name: Validate release inputs before building
        id: release
        env:
          CREATE_DRAFT: ${{ github.event_name == 'push' || inputs.draft }}
          RELEASE_REF: ${{ github.ref }}
          BENCHMARK_SCHEDULE: ${{ inputs.benchmark_schedule }}
        run: |
          set -euo pipefail
          version=$(python3 app/SiloUI/scripts/validate-release-version.py)
          if [[ "$CREATE_DRAFT" == true ]]; then
            if [[ "${BENCHMARK_SCHEDULE:-parallel}" == sequential ]]; then
              echo "::error::Sequential benchmarking is artifact-only."
              exit 1
            fi
            if [[ "$RELEASE_REF" != "refs/tags/v$version" ]]; then
              echo "::error::Release ref must be refs/tags/v$version."
              exit 1
            fi
            if [[ ! -s "docs/releases/$version.md" ]]; then
              echo "::error::Missing release notes: docs/releases/$version.md. Run npm run release:version in app/SiloUI."
              exit 1
            fi
            shopt -s nullglob
            for changeset in app/SiloUI/.changeset/*.md; do
              if [[ "$(basename "$changeset")" != README.md ]]; then
                echo "::error::Pending changeset $changeset. Run npm run release:version in app/SiloUI before tagging."
                exit 1
              fi
            done
          fi
          echo "draft=$CREATE_DRAFT" >> "$GITHUB_OUTPUT"

  macos-minimum-constraints:
    needs: validate
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source-ref }}
      - name: Verify library constraints on minimum macOS version
        run: python3 app/SiloUI/scripts/test-macos-library-constraints.py --constraints-only --output "$RUNNER_TEMP/library-constraints"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-14-library-constraints
          path: ${{ runner.temp }}/library-constraints/results.json
          if-no-files-found: error
          retention-days: 7

  frontend:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app/SiloUI
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source-ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/SiloUI/package-lock.json
      - run: npm ci
      - run: npm run test:release
      - run: npm test -- --maxWorkers=2 --testTimeout=15000
      - run: npm run typecheck
      - run: npm run lint


  platforms:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            bundles: app
            asset: macos-arm64
            cache-output: runtime-macos
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            asset: linux-x64
            cache-output: runtime-x64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,appimage
            asset: linux-arm64
            cache-output: runtime-arm64
    uses: ./.github/workflows/release-platform.yml
    with:
      runner: ${{ matrix.runner }}
      source-ref: ${{ needs.validate.outputs.source-ref }}
      target: ${{ matrix.target }}
      bundles: ${{ matrix.bundles }}
      asset: ${{ matrix.asset }}
      draft: ${{ needs.validate.outputs.draft == 'true' }}
      runtime-cache-hit: ${{ needs.validate.outputs[matrix.cache-output] == 'true' }}
      benchmark-schedule: ${{ inputs.benchmark_schedule || 'parallel' }}
    secrets:
      SILO_GITHUB_APP_SLUG: ${{ secrets.SILO_GITHUB_APP_SLUG }}
      SILO_GITHUB_CLIENT_ID: ${{ secrets.SILO_GITHUB_CLIENT_ID }}
      SILO_GITHUB_CLIENT_SECRET: ${{ secrets.SILO_GITHUB_CLIENT_SECRET }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  draft:
    if: needs.validate.outputs.draft == 'true'
    needs: [validate, frontend, platforms, macos-minimum-constraints]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source-ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Test release publication
        run: python3 -m unittest discover -s app/SiloUI/scripts -p 'test_*release*.py'
      - name: Read version and release notes
        run: |
          version=$(node -p "require('./app/SiloUI/package.json').version")
          cp "docs/releases/$version.md" release-notes.md
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Create complete versioned draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 app/SiloUI/scripts/publish-release.py "$RELEASE_VERSION"
