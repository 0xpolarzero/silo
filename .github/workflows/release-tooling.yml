name: Verify release tooling

on:
  pull_request:
    paths:
      - 'app/SiloUI/.changeset/**'
      - 'app/SiloUI/scripts/**'
      - 'app/SiloUI/package*.json'
      - 'app/SiloUI/runtime-inputs.json'
      - 'app/SiloUI/patches/**'
      - 'app/SiloUI/src-tauri/src/dependencies.rs'
      - 'app/SiloUI/src-tauri/Cargo.*'
      - 'app/SiloUI/src-tauri/guest/**'
      - 'app/SiloUI/src-tauri/build.rs'
      - 'app/SiloUI/src-tauri/src/main.rs'
      - '.github/workflows/*release*.yml'
      - '.github/workflows/apt-repository.yml'
      - '.github/actions/prepare-release-runtime/**'
  push:
    branches: [main]
    paths:
      - 'app/SiloUI/.changeset/**'
      - 'app/SiloUI/scripts/**'
      - 'app/SiloUI/package*.json'
      - 'app/SiloUI/runtime-inputs.json'
      - 'app/SiloUI/patches/**'
      - 'app/SiloUI/src-tauri/src/dependencies.rs'
      - 'app/SiloUI/src-tauri/Cargo.*'
      - 'app/SiloUI/src-tauri/guest/**'
      - 'app/SiloUI/src-tauri/build.rs'
      - 'app/SiloUI/src-tauri/src/main.rs'
      - '.github/workflows/*release*.yml'
      - '.github/workflows/apt-repository.yml'
      - '.github/actions/prepare-release-runtime/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app/SiloUI
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/SiloUI/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: node scripts/preflight.mjs
      - run: npm ci
      - run: npm run test:release
      - run: python3 scripts/validate-release-version.py
      - run: python3 scripts/check-command-manifest.py
      - run: sudo apt-get update && sudo apt-get install -y gnupg dpkg-dev pkexec
      # Discover every script test so new test files cannot be silently skipped.
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: sudo env SILO_APT_LIFECYCLE_TEST=1 python3 -m unittest discover -s scripts -p 'test_debian_installation.py'
