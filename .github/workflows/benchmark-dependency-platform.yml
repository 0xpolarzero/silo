name: Measure one platform's public dependency reuse

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      target:
        required: true
        type: string

permissions:
  contents: read

jobs:
  producer:
    if: github.ref == 'refs/heads/main'
    outputs:
      artifact-name: ${{ steps.archive.outputs.artifact-name }}
      archive-sha256: ${{ steps.archive.outputs.sha256 }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app/SiloUI
        shell: bash
    env:
      SILO_GITHUB_APP_SLUG: silo-cache-experiment
      SILO_GITHUB_CLIENT_ID: synthetic-cache-client
      SILO_GITHUB_CLIENT_SECRET: SILO-CACHE-PRODUCER-CONFIG-SENTINEL
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/SiloUI/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libclang-dev libcap-ng-dev cmake
      - name: Install exact runtime Rust toolchain
        run: |
          runtime_toolchain=$(node -p "require(process.env.GITHUB_WORKSPACE + '/app/SiloUI/runtime-inputs.json').toolchain")
          rustup toolchain install "$runtime_toolchain" --profile minimal
          rustup default "$runtime_toolchain"
          test "$(rustc --print host-tuple)" = '${{ inputs.target }}'
      - name: Set stable isolated compilation paths
        run: |
          echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/app/SiloUI/src-tauri/target/release-compile" >> "$GITHUB_ENV"
          echo "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_ENV"
      - run: npm ci
      - uses: ./.github/actions/prepare-release-runtime
        with:
          runner: ${{ inputs.runner }}
          target: ${{ inputs.target }}
      - name: Build frontend assets once
        run: npm run build
      - name: Resolve the exact production feature graph and local context
        run: |
          cargo metadata --locked --format-version 1 --filter-platform '${{ inputs.target }}' --features tauri/custom-protocol --manifest-path src-tauri/Cargo.toml > "$RUNNER_TEMP/metadata.json"
          python3 scripts/dependency-cache-benchmark.py context --target '${{ inputs.target }}' --report "$RUNNER_TEMP/context.json"
      - name: Measure cold production compilation with synthetic configuration
        run: python3 scripts/dependency-cache-benchmark.py build --role producer --target '${{ inputs.target }}' --metadata "$RUNNER_TEMP/metadata.json" --messages "$RUNNER_TEMP/cargo-messages.jsonl" --report "$RUNNER_TEMP/control.json"
      - name: Export and audit only reviewed public dependencies
        run: |
          python3 scripts/measure-command.py dependency-export -- python3 scripts/cargo-dependency-cache.py export --metadata "$RUNNER_TEMP/metadata.json" --messages "$RUNNER_TEMP/cargo-messages.jsonl" --lockfile src-tauri/Cargo.lock --context "$RUNNER_TEMP/context.json" --target '${{ inputs.target }}' --target-dir "$CARGO_TARGET_DIR" --cargo-home "$CARGO_HOME" --cache-dir "$RUNNER_TEMP/dependency-cache" --forbid "$SILO_GITHUB_CLIENT_SECRET" --report "$RUNNER_TEMP/export-audit.json"
          python3 scripts/cargo-dependency-cache.py audit --metadata "$RUNNER_TEMP/metadata.json" --lockfile src-tauri/Cargo.lock --context "$RUNNER_TEMP/context.json" --target '${{ inputs.target }}' --target-dir "$CARGO_TARGET_DIR" --cargo-home "$CARGO_HOME" --cache-dir "$RUNNER_TEMP/dependency-cache" --forbid "$SILO_GITHUB_CLIENT_SECRET"
      - name: Archive audited public dependencies only
        id: archive
        run: |
          python3 scripts/dependency-cache-benchmark.py pack --cache-dir "$RUNNER_TEMP/dependency-cache" --archive "$RUNNER_TEMP/dependency-cache.tar.gz" --report "$RUNNER_TEMP/archive.json" >> "$GITHUB_OUTPUT"
          echo "artifact-name=dependency-cache-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.artifact-name }}
          path: |
            ${{ runner.temp }}/dependency-cache.tar.gz
            ${{ runner.temp }}/control.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Retain public producer metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-control-${{ inputs.target }}
          path: |
            ${{ runner.temp }}/control.json
            ${{ runner.temp }}/context.json
            ${{ runner.temp }}/export-audit.json
            ${{ runner.temp }}/archive.json
            ${{ runner.temp }}/build-phases.jsonl
          if-no-files-found: ignore
          retention-days: 7

  consumer:
    needs: producer
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app/SiloUI
        shell: bash
    env:
      SILO_GITHUB_APP_SLUG: silo-cache-experiment
      SILO_GITHUB_CLIENT_ID: synthetic-cache-client
      SILO_GITHUB_CLIENT_SECRET: SILO-CACHE-CONSUMER-CONFIG-SENTINEL
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/SiloUI/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libclang-dev libcap-ng-dev cmake
      - name: Install exact runtime Rust toolchain
        run: |
          runtime_toolchain=$(node -p "require(process.env.GITHUB_WORKSPACE + '/app/SiloUI/runtime-inputs.json').toolchain")
          rustup toolchain install "$runtime_toolchain" --profile minimal
          rustup default "$runtime_toolchain"
          test "$(rustc --print host-tuple)" = '${{ inputs.target }}'
      - name: Set stable isolated compilation paths
        run: |
          echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/app/SiloUI/src-tauri/target/release-compile" >> "$GITHUB_ENV"
          echo "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_ENV"
      - run: npm ci
      - uses: ./.github/actions/prepare-release-runtime
        with:
          runner: ${{ inputs.runner }}
          target: ${{ inputs.target }}
      - name: Build frontend assets once
        run: npm run build
      - name: Resolve the exact production feature graph and local context
        run: |
          cargo metadata --locked --format-version 1 --filter-platform '${{ inputs.target }}' --features tauri/custom-protocol --manifest-path src-tauri/Cargo.toml > "$RUNNER_TEMP/metadata.json"
          python3 scripts/dependency-cache-benchmark.py context --target '${{ inputs.target }}' --report "$RUNNER_TEMP/context.json"
      - name: Start transfer-inclusive measurement
        run: python3 scripts/dependency-cache-benchmark.py mark --report "$RUNNER_TEMP/transfer-start.json"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.producer.outputs.artifact-name }}
          path: ${{ runner.temp }}/dependency-transfer
      - name: Verify transport and restore dependencies or fall back cold
        env:
          EXPECTED_ARCHIVE_SHA256: ${{ needs.producer.outputs.archive-sha256 }}
        run: python3 scripts/dependency-cache-benchmark.py restore --archive "$RUNNER_TEMP/dependency-transfer/dependency-cache.tar.gz" --sha256 "$EXPECTED_ARCHIVE_SHA256" --cache-dir "$RUNNER_TEMP/dependency-cache" --target-dir "$CARGO_TARGET_DIR" --cargo-home "$CARGO_HOME" --metadata "$RUNNER_TEMP/metadata.json" --context "$RUNNER_TEMP/context.json" --target '${{ inputs.target }}' --started "$RUNNER_TEMP/transfer-start.json" --report "$RUNNER_TEMP/restore.json" --audit-report "$RUNNER_TEMP/restore-audit.json"
      - name: Measure production compilation with rotated synthetic configuration
        run: python3 scripts/dependency-cache-benchmark.py build --role consumer --target '${{ inputs.target }}' --metadata "$RUNNER_TEMP/metadata.json" --messages "$RUNNER_TEMP/cargo-messages.jsonl" --report "$RUNNER_TEMP/consumer.json"
      - name: Record acceptance without hiding correctness failures
        if: always()
        run: python3 scripts/dependency-cache-benchmark.py summarize --target '${{ inputs.target }}' --control "$RUNNER_TEMP/dependency-transfer/control.json" --consumer "$RUNNER_TEMP/consumer.json" --restore-report "$RUNNER_TEMP/restore.json" --report "$RUNNER_TEMP/summary.json"
      - name: Retain public comparison evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-result-${{ inputs.target }}
          path: |
            ${{ runner.temp }}/summary.json
            ${{ runner.temp }}/consumer.json
            ${{ runner.temp }}/context.json
            ${{ runner.temp }}/restore.json
            ${{ runner.temp }}/restore-audit.json
            ${{ runner.temp }}/build-phases.jsonl
          if-no-files-found: ignore
          retention-days: 7
