name: Verify macOS library security
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Record operating-system security configuration
        run: |
          mkdir -p "$RUNNER_TEMP/security-host"
          sw_vers > "$RUNNER_TEMP/security-host/os.txt"
          uname -m >> "$RUNNER_TEMP/security-host/os.txt"
          csrutil status > "$RUNNER_TEMP/security-host/sip.txt" 2>&1
          sysctl kern.bootargs > "$RUNNER_TEMP/security-host/bootargs.txt" 2>&1
          cat "$RUNNER_TEMP/security-host/"*.txt
      - name: Test library constraints (hosted SIP is disabled)
        run: python3 app/SiloUI/scripts/test-macos-library-constraints.py --constraints-only --output "$RUNNER_TEMP/library-constraints"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.runner }}-security
          path: |
            ${{ runner.temp }}/security-host/
            ${{ runner.temp }}/library-constraints/results.json
          if-no-files-found: error
          retention-days: 7
