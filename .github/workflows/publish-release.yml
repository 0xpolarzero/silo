name: Publish verified Silo draft
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version of the reviewed draft, for example 0.1.0
        required: true
        type: string
concurrency:
  group: silo-release-publish
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    environment: release-publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y minisign squashfs-tools
      - name: Verify and publish existing draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          test "$RELEASE_REF" = "refs/tags/v$RELEASE_VERSION"
          python3 app/SiloUI/scripts/publish-release.py "$RELEASE_VERSION" --publish
