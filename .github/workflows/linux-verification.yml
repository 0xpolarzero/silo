name: Linux verification

on:
  workflow_dispatch:
  push:
    branches: ['verify-linux-*']
  pull_request:
    paths: ['app/SiloUI/**', '.github/workflows/linux-verification.yml']

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app/SiloUI
    env:
      # Synthetic build values: these tests never sign in to a GitHub account.
      SILO_GITHUB_APP_SLUG: silo-linux-test
      SILO_GITHUB_CLIENT_ID: test-client
      SILO_GITHUB_CLIENT_SECRET: test-secret
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/SiloUI/package-lock.json
      - name: Install Linux build and desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev libclang-dev libcap-ng-dev cmake webkit2gtk-driver xvfb dbus-x11 python3-selenium
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/SiloUI/src-tauri
      - run: npm ci
      - run: npm test -- --maxWorkers=2
      - run: npm run lint
      - run: npm run runtime:prepare
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked -- --test-threads=1
      - name: Build production Linux application
        run: npm run desktop:build -- --debug --no-bundle --ci
      - name: Install external WebDriver
        run: cargo install tauri-driver --version 2.0.6 --locked
      - name: Verify native WebKit onboarding and validation
        run: xvfb-run -a dbus-run-session -- python3 scripts/test-linux-desktop.py
      - name: Verify real hardware runtime operations
        if: ${{ !cancelled() }}
        run: |
          if test -e /dev/kvm; then sudo chmod a+rw /dev/kvm; fi
          python3 scripts/test-linux-runtime.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-evidence-${{ matrix.runner }}
          path: app/SiloUI/test-results/linux/
          if-no-files-found: warn
          retention-days: 7
