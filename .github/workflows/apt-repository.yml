name: Publish Silo system updates
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Publish verified Silo draft]
    types: [completed]
  schedule:
    # Refresh the signed metadata before its 14-day expiry, even without releases.
    - cron: '17 6 * * 1'
concurrency:
  group: silo-apt-repository
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    environment:
      name: apt-publish
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Read GitHub's signed release attestations for each downloaded package.
      attestations: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y gnupg dpkg-dev
      - name: Test signed repository generation
        run: python3 -m unittest discover -s app/SiloUI/scripts -p 'test_apt_repository.py'
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        id: pages
      - name: Download verified public packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 app/SiloUI/scripts/download-apt-releases.py apt-packages
      - name: Sign update repository
        env:
          SILO_APT_SIGNING_KEY: ${{ secrets.SILO_APT_SIGNING_KEY }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -eu
          test -n "$SILO_APT_SIGNING_KEY"
          export GNUPGHOME="$(mktemp -d)"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s' "$SILO_APT_SIGNING_KEY" | gpg --batch --import
          python3 app/SiloUI/scripts/apt-repository.py --packages apt-packages --output apt-site --previous-url "${PAGES_URL%/}/apt" --fingerprint "$(cat app/SiloUI/scripts/debian/signing-fingerprint.txt)"
      - name: Reject stale publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: test "$(cat apt-packages/latest-version)" = "$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: apt-site
      - name: Publish system updates
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5