name: Publish Silo guest image
on:
  workflow_dispatch:
  push:
    branches: ['publish-guest-*']
permissions:
  contents: read
concurrency:
  group: publish-silo-guest
  cancel-in-progress: false
jobs:
  protection:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      # GitHub creates a missing environment without protection on first use, so
      # refuse to publish until the environment requires a reviewer.
      - name: Require an approval-protected publishing environment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          rules=$(gh api "repos/$GH_REPO/environments/guest-image-publish" --jq '[.protection_rules[]?.type] | join(",")' 2>/dev/null || true)
          case ",$rules," in
            *,required_reviewers,*) ;;
            *)
              echo '::error::Create the guest-image-publish environment with required reviewers before publishing. See docs/SiloUI-GUEST-IMAGES.md.'
              exit 1
              ;;
          esac
  publish:
    needs: protection
    environment: guest-image-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # The build script owns the recipe version and derives every published name.
      - name: Read image version and names
        id: image
        run: node app/SiloUI/scripts/build-guest-image.mjs metadata >> "$GITHUB_OUTPUT"
      - name: Refuse replacing an existing image release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "This image version is published. Increment the recipe version before publishing again."
            exit 1
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse replacing an already published architecture
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          for arch in arm64 amd64; do
            if docker manifest inspect "$IMAGE-$arch" >/dev/null 2>&1; then
              echo "This image architecture is already published. Recover the exact artifact or publish a new version."
              exit 1
            fi
          done
      - name: Build and verify both guest architectures
        run: |
          node app/SiloUI/scripts/build-guest-image.mjs arm64
          node app/SiloUI/scripts/build-guest-image.mjs amd64
      - name: Publish standard container images and multi-architecture tag
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          docker push "$IMAGE-arm64"
          docker push "$IMAGE-amd64"
          docker manifest create "$IMAGE" "$IMAGE-arm64" "$IMAGE-amd64"
          docker manifest push "$IMAGE"
      - name: Publish exact app bundle archives and provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          IMAGE: ${{ steps.image.outputs.image }}
          RELEASE_TAG: ${{ steps.image.outputs.tag }}
          RELEASE_TITLE: ${{ steps.image.outputs.title }}
        run: |
          mkdir guest-release
          for arch in arm64 amd64; do
            cp app/SiloUI/src-tauri/guest-image-artifacts/$arch/image.tar.gz guest-release/image-$arch.tar.gz
            cp app/SiloUI/src-tauri/guest-image-artifacts/$arch/manifest.json guest-release/manifest-$arch.json
          done
          cp app/SiloUI/guest-image/Dockerfile guest-release/Dockerfile
          cp app/SiloUI/src-tauri/guest/setup-github.sh guest-release/setup-github.sh
          printf '%s\n' "$GITHUB_SHA" > guest-release/source-commit.txt
          (cd guest-release && sha256sum image-*.tar.gz > SHA256SUMS)
          gh release create "$RELEASE_TAG" guest-release/* --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes "Ubuntu 24.04 with curl, Git, Git LFS, gh, sudo, Python, OpenSSH SFTP server and Silo integration. Working-account creation is offline. Exact bundled archives, package inventories and image config digests are attached. Standard OCI images: $IMAGE. No credentials or user data." --latest=false
