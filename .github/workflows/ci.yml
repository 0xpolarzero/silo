name: CI

# Work lands directly on main, so every push to main and every pull request
# runs the ordinary checks. Release, packaging and live VM checks stay in their
# own workflows.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend and scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app/SiloUI
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            app/SiloUI/package-lock.json
            website/package-lock.json
            demo/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: node scripts/preflight.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --maxWorkers=2
      - run: npm run test:release
      - run: python3 scripts/validate-release-version.py
      - name: Check build.rs declares every registered Tauri command
        run: python3 scripts/check-command-manifest.py
      - name: Install Debian and APT tooling for script tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gnupg dpkg-dev
      - name: Run every release and packaging script test
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Typecheck the website demo
        working-directory: website
        run: |
          npm ci
          npm run typecheck
      - name: Typecheck the demo films
        working-directory: demo
        run: |
          npm ci
          npm run typecheck

  docs:
    name: Documentation links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # lychee checks links; offline mode checks only local files, so web links
      # never make CI flaky. The download is pinned to the release asset digest.
      - name: Install lychee
        env:
          LYCHEE_RELEASE: lychee-v0.24.2
          LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/lychee.tar.gz" "https://github.com/lycheeverse/lychee/releases/download/$LYCHEE_RELEASE/lychee-x86_64-unknown-linux-gnu.tar.gz"
          echo "$LYCHEE_SHA256  $RUNNER_TEMP/lychee.tar.gz" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/lychee"
          tar -xzf "$RUNNER_TEMP/lychee.tar.gz" -C "$RUNNER_TEMP/lychee"
          lychee=$(find "$RUNNER_TEMP/lychee" -type f -name lychee | head -n 1)
          test -x "$lychee"
          echo "LYCHEE=$lychee" >> "$GITHUB_ENV"
      - name: Check relative links in Markdown documentation
        run: >-
          "$LYCHEE" --offline --no-progress
          README.md AGENTS.md 'docs/**/*.md' 'app/SiloUI/*.md' 'app/SiloUI/tests/**/*.md'
          'artifacts/**/*.md' 'website/*.md' 'demo/*.md'

  rust:
    name: Rust tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app/SiloUI
    env:
      # Synthetic build values from the release guide: these tests never sign in
      # to a GitHub account, and the test executables are never distributed.
      SILO_GITHUB_APP_SLUG: silo-ci-test
      SILO_GITHUB_CLIENT_ID: test-client
      SILO_GITHUB_CLIENT_SECRET: test-secret
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/SiloUI/package-lock.json
      - run: node scripts/preflight.mjs
      - name: Install Linux build dependencies and the pinned Rust toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev libclang-dev libcap-ng-dev cmake
          runtime_toolchain=$(node -p "require(process.env.GITHUB_WORKSPACE + '/app/SiloUI/runtime-inputs.json').toolchain")
          rustup toolchain install "$runtime_toolchain" --profile minimal --component rustfmt
          rustup default "$runtime_toolchain"
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/SiloUI/src-tauri
      - run: npm ci
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.x'
          cache: false
      - run: npm run runtime:prepare
      # Process-wide state is isolated inside the suite; use default test threads.
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
