<!doctype html>
<html lang="en" class="screenshot-capture"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Silo screenshot capture</title>
<script>document.documentElement.classList.toggle('dark', new URLSearchParams(location.search).get('theme') === 'dark');</script><style>
.screenshot-capture.dark .demo-app .silo-application {
 background:#101e26; --application-glass:rgb(21 44 50 / 55%);
 --application-navigation:#c2dbd7; --application-navigation-active:#e1fff4;
 --application-hover:rgb(255 255 255 / 6%); --application-selection:rgb(255 255 255 / 9%); --application-selection-hover:rgb(255 255 255 / 12%);
}

/* Temporary photography harness: show the default glass material without
   changing the host's reduced-transparency preference. */
.screenshot-capture .demo-app .silo-application {
 background:#e9eeed; --application-glass:rgb(246 255 253 / 32%);
 --application-navigation:#395757; --application-navigation-active:#174d50;
 --application-hover:rgb(255 255 255 / 25%); --application-selection:rgb(255 255 255 / 44%); --application-selection-hover:rgb(255 255 255 / 55%);
}
.screenshot-capture .silo-application .application-backdrop {display:block;}
.screenshot-capture .silo-application > header,
.screenshot-capture .silo-application .silo-sidebar {background:var(--application-glass);backdrop-filter:blur(18px) saturate(1.25);-webkit-backdrop-filter:blur(18px) saturate(1.25);}
.screenshot-capture .silo-application .application-content {background:var(--application-content);}
</style></head><body><div id="demo-root"></div><script type="module" src="/src/demo/entry.tsx"></script></body></html>
