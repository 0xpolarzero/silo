vmType: vz
arch: aarch64
nestedVirtualization: true
cpus: 8
memory: 16GiB
disk: 80GiB
images:
  - location: https://cloud-images.ubuntu.com/releases/resolute/release-20260720/ubuntu-26.04-server-cloudimg-arm64.img
    arch: aarch64
    digest: sha256:7bcf159e29ad0000bfed9c57875908c39268f5ed1257f4958fa6a9f5f60edd54
param:
  internal_netplanOptional: "true"
mounts: []
containerd:
  system: false
  user: false
ssh:
  loadDotSSHPubKeys: false
  forwardAgent: false
  forwardX11: false
portForwards:
  - guestPort: 3800
    hostPort: 13800
    hostIP: 127.0.0.1
  - guestPort: 3801
    hostPort: 13801
    hostIP: 127.0.0.1
  - guestIP: 0.0.0.0
    guestIPMustBeZero: false
    proto: any
    ignore: true
provision:
  - mode: system
    script: |
      #!/bin/sh
      set -eu
      test -c /dev/kvm
      test "$(getconf PAGESIZE)" = 4096
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y docker.io docker-compose-v2 python3-venv iptables rsync e2fsprogs iproute2
      systemctl enable --now docker
